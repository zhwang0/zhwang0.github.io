<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | Zhihao Wang</title>
  <meta name="description" content="{{ page.description | escape }}">
  <script src="/assets/js/theme.js?v=20260902-theme1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/main.css?v=20260813-performance">
  <link rel="stylesheet" href="/assets/css/theme.css?v=20261112-navigation1">
  <link rel="stylesheet" href="/assets/css/knowledge.css?v=20261113-readingroom4">
</head>
<body class="knowledge-view">
  <a class="knowledge-skip-link" href="#main-content">Skip to content</a>
  <nav id="navbar" class="navbar fixed-top navbar-light" aria-label="Reading Room navigation">
    <div class="container-fluid p-0">
      <a class="navbar-brand title" href="/">Zhihao Wang</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-label-light">Dark</span><span class="theme-label-dark">Light</span>
      </button>
      <a class="knowledge-home" href="/" aria-label="Back to main website">Back</a>
    </div>
  </nav>

  <main id="main-content" class="knowledge-note" tabindex="-1">
    <a class="knowledge-back" href="/knowledge/#learning-notes">Back to learning notes</a>
    <header class="knowledge-note-header">
      <p class="knowledge-eyebrow">From the reading desk</p>
      <h1>{{ page.title | escape }}</h1>
      {% if page.description %}<p class="knowledge-note-description">{{ page.description | escape }}</p>{% endif %}
      {% if page.date %}<p class="knowledge-note-date"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>{% endif %}
    </header>
    <article class="note-prose">
      {{ content }}
    </article>
  </main>

  <footer class="knowledge-footer">
    <div class="knowledge-footer-inner">
      <span>Zhihao Wang</span>
      <a href="/knowledge/">Reading Room</a>
    </div>
  </footer>
  <script src="/assets/js/site.js?v=20260818-navigation1"></script>
</body>
</html>
